id = "I-004"
title = "Deposition (particle to mesh)"
status = "proposed"
source = "docs/plan/architecture-draft.md sections 0.1 and 0.4 (rule 3); open-items A4 and A8; factory-and-observability.md section 1 names `deposit_current!` as an example contract"
contract = """The particle-to-mesh transfer with shape functions exists in two first-class variants behind one interface, tested for equality: atomics (native fast path) and sort plus segmented reduction (deterministic, raisable, the reference mode of A4). The raised path may also use scatter-add; its determinism is a measurement, not an assumption. The accumulation path is chosen by a trait on `T`: primitive types use atomics, duals per-component atomics, compensated types the sorted segmented reduction."""
derived_from = ["D-004", "D-008", "D-009"]
open = """The signature of `deposit_current!` and its semantics (staggering, guard cells, filtering) are not written down in the plan."""
