contract = """Particle sets are structure-of-arrays buffers of fixed capacity with an alive mask and a count; the engine owns cell sorting and compaction. Injection and the moving window write into free slots; compaction is a stable partition within the same buffer. No data-dependent allocation inside `step!`. The element type `T` is a parameter (A8)."""
