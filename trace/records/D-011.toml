id = "D-011"
title = "Package environments"
status = "accepted"
source = "docs/plan/open-items.md A11"
decision = """
The root Project.toml declares a Pkg workspace with test/, docs/, benchmark/ and the lib/ subpackages as members; they resolve together into one root Manifest.toml, which is committed. scripts/ is a separate environment outside the workspace, with the root package as a path source and its own committed manifest."""
alternatives_rejected = []
rationale = """
One committed root manifest means every worktree and every agent runs the same versions and the depot precompiles them once; a separate scripts/ environment with its own committed manifest makes a result reproducible from the commit alone."""
consequences = """
Changing a dependency means re-resolving both manifests; CI instantiates both and fails if either changes. The pre-release CI job updates the manifest before testing, since the committed one is resolved for Julia 1.13."""
derived_from = ["R-008"]
links_note = """The derived_from links are the transcriber's reading of which requirements of landscape section 6 this decision serves; the plan text does not state them."""
hash = "sha256:23fe2ae1be991fb18a89d84051d5808df47cad08766f15f3386159a5b1553cea"

