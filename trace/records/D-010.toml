id = "D-010"
title = "Problem description separated from numerical implementation"
status = "accepted"
source = "docs/plan/open-items.md A10"
decision = """
Principle: the problem description is kept separate from the numerical implementation, which is the reason to keep the symbolic connection. Not blocking; it shapes the kernel interfaces (architecture §0.5, R13). The mesh-solve slot admits Yee kernels and MOL's staggered update now, the MOL Ferrite backend (expected, not public) and Trixi DG later."""
alternatives_rejected = []
rationale = """
Keeping the symbolic connection enforces a separation of concerns between describing the problem and implementing the numerics."""
consequences = """
It shapes the kernel interfaces. None of the later mesh-solve backends (MOL Ferrite, Trixi DG) serves the LWFA module."""
derived_from = ["R-013"]
links_note = """R-013 cites this decision in landscape section 6."""
