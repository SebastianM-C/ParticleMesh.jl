id = "D-013"
title = "Results, plots and reports"
status = "accepted"
source = "docs/plan/open-items.md A13"
decision = """
scripts/ holds the user code that produces results: benchmark cases with expected values, validation and cross-code comparison runs, campaigns, and the figures reports embed; outputs go to scripts/runs/ (ignored) and every run is recorded in trace/ with its inputs hashed. All plots are made with CairoMakie from scripts/, never from package code (Makie recipes may live in a package extension); each plot is a PNG next to a JSON sidecar with the scalar values it shows. Reports are Markdown in reports/, one directory per report with the figures committed, headed by the work package, the commit, the run ids and the input hashes. The current-state view is a static page the trace builder generates from trace/build/graph.json, the latest digest and the report index, published by CI to GitHub Pages on every merge to main; the overseer may publish the same page as a Claude artifact for a private, commentable copy (to verify: Artifact tool availability in the overseer's session type, and that artifact comments reach it)."""
alternatives_rejected = ["Plots made from package code: plots are made only from scripts/ (Makie recipes may live in a package extension)."]
rationale = """
Sidecars let agents and the trace builder read numbers, not pixels; headed reports make a report a record."""
consequences = """
Every run is recorded in trace/ with its inputs hashed; the trace builder generates the current-state page."""
derived_from = ["R-007", "R-014"]
links_note = """The derived_from links are the transcriber's reading of which requirements of landscape section 6 this decision serves; the plan text does not state them."""
