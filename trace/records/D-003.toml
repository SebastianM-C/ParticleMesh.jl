id = "D-003"
title = "How parameters enter the simulation"
status = "accepted"
source = "docs/plan/open-items.md A3"
decision = """
Density and profile parameters enter through particle weights, not through particle positions. Laser parameters enter through the antenna source. Focus position and chirp enter through the antenna phase."""
alternatives_rejected = ["Parameters entering through particle positions: sampling is not smooth in the parameters, weights are."]
rationale = """
Weights are smooth in the parameters, sampling is not."""
consequences = """
This fixes the tangent seeding and must hold in every injection path, including the moving-window refill."""
derived_from = ["R-003", "R-009"]
links_note = """The derived_from links are the transcriber's reading of which requirements of landscape section 6 this decision serves; the plan text does not state them."""
hash = "sha256:c594b487fb2ed6213431d82631e7beca503b5b8129aaf7c92ce6cb391e20f2a3"

