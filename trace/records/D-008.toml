id = "D-008"
title = "Element type is a user-level choice, never hard-coded"
status = "accepted"
source = "docs/plan/open-items.md A8"
decision = """
The core is generic over the number type T so that FP32, FP64, custom types such as DoubleFloats, and ForwardDiff duals all run through the same kernels. Float32, Float64 and duals are the required set; DoubleFloats is nice to have, not required. On consumer cards the candidate for extra precision is Double32 (pairs of Float32 at FP32 throughput, about 48 mantissa bits)."""
alternatives_rejected = [
    "Working around gaps in DoubleFloats: if it lacks something the kernels need, drop it rather than work around it.",
    "Double64 as the extra-precision type on consumer cards: it inherits the 1/64 FP64 rate.",
]
rationale = """
The plan text gives no rationale beyond the decision itself; it notes that type genericity also admits instrumentation types (flop counting, error tracking) in tests."""
consequences = """
No float literals in kernels (zero(T), T(π), eps(T)); a CI test matrix on the CPU backend over Float32, Float64, Double32 and Dual{Float32,3}; deposition chooses its accumulation path by a trait on T (primitive types use atomics; duals are component-wise linear so per-component atomics are exact; compensated types such as Double32/Double64 are not associative component-wise, so they take the sorted segmented-reduction path); a GPU-kernel compatibility spike for DoubleFloats (their exp, sin implementations inside CUDA kernels are untested here)."""
derived_from = ["R-006", "R-009"]
links_note = """The derived_from links are the transcriber's reading of which requirements of landscape section 6 this decision serves; the plan text does not state them."""
hash = "sha256:e76a0d61c6c55a5fb8a9c6a1c62c347f4177fd34843832772a23705603b2a4a2"

