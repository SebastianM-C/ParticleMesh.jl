id = "D-009"
title = "Scope: a generic particle–mesh framework"
status = "accepted"
source = "docs/plan/open-items.md A9"
decision = """
Long term the project is a showcase and stress test for Julia and Reactant compiler technology, with modular physics (extensible, possible EDM integration) and connections to packages such as Molly.jl to be explored; all of it long term. The main integration goal is SciML."""
alternatives_rejected = [
    "Molly compatibility as a design driver: it is a nice-to-have, not a design driver.",
    "FastMultipole.jl (CUDA for direct interactions only): not needed for LWFA.",
]
rationale = """
The plan text gives no rationale beyond the decision itself."""
consequences = """
None of these change the phase 1–3 schedule: the engine/physics-module split with the electrostatic PIC module as the proof (architecture-draft.md §0.1); the Reactant-compatibility rules and a Reactant CPU smoke test in CI from the first package (§0.4); the particle-workload stress-test suite as a deliverable (§0.2); the name (A6). Everything else in §0 is deferred (C)."""
derived_from = ["R-011", "R-012"]
links_note = """R-011 and R-012 cite this decision in landscape section 6."""
