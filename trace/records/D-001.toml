id = "D-001"
title = "Units and normalization"
status = "accepted"
source = "docs/plan/open-items.md A1"
decision = """
The core works in normalized units (c = 1, lengths in c/ω₀ or c/ω_p, fields in m_e c ω/e); the user layer offers SI and possibly other unit systems, as EDM does. ω₀ is the reference frequency (time in 1/ω₀, length in c/ω₀, fields in m_e c ω₀/e, density in units of n_c), matching Smilei; wake quantities in ω_p units are derived views. Nondimensionalize the optimization parameters to O(1)."""
alternatives_rejected = []
rationale = """
ω₀ as reference matches Smilei. The optimization parameters are nondimensionalized to O(1) so that FP32 tangents are well scaled."""
consequences = """
Wake quantities in ω_p units are derived views; unit conversion is offered by the user layer (SI and possibly other unit systems)."""
derived_from = ["R-003", "R-006"]
links_note = """The derived_from links are the transcriber's reading of which requirements of landscape section 6 this decision serves; the plan text does not state them."""
hash = "sha256:4a5cce7d0515b2b994c647d1041c77d2b4a88647f30ab2e00afa7ca3159d6abd"

