id = "I-002"
title = "Container"
status = "proposed"
source = "docs/plan/architecture-draft.md section 0.1 (interface sketch)"
contract = """A container holding species, grids and fields: a problem-like object that SciML can `solve` through the `DiscreteProblem`/`FunctionMap` harness, with parameters following the SciML conventions (`p`, MTK parameter identities, `remake`). Element type `T`, dimension `N` and the array type (hence the backend) are type parameters of the container. Unit handling stays in the user layer (A1)."""
derived_from = ["D-001", "D-008", "D-009"]
open = """The plan gives the role and the type parameters, not the type definition."""
