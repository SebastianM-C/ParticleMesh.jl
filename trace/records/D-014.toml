id = "D-014"
title = "Merge policy"
status = "accepted"
source = "docs/plan/open-items.md A14"
decision = """
main is protected by a ruleset: pull requests only, squash merges, one approving review, review from the code owners for the tier-2 paths in .github/CODEOWNERS, required status checks (the CI jobs and the review gate), no bypass for agents (repository admins may bypass on pull requests only; cloud sessions act as the owner's account and so hold that bypass technically, and only the contract keeps them from merging). Tier 0 and tier 1 PRs merge unattended: .github/workflows/review.yml runs two reviewer lenses (numerics, code; briefs in .claude/agents/, read from the base branch) on every non-draft PR and its gate job approves or requests changes as github-actions[bot]; the PR author enables auto-merge after opening the PR, and GitHub merges and deletes the branch when the requirements are met. Tier 2 PRs wait for the owner's approval in addition. Two repository settings are prerequisites: "Allow GitHub Actions to create and approve pull requests" and the ruleset's dismissal of stale approvals on push. Identities: local factory sessions act on GitHub as the GitHub App particlemesh-factory[bot] (one-hour installation tokens, the app installed on this repository only, no Workflows permission so agents cannot change CI); cloud sessions act as the owner's account through Anthropic's GitHub proxy, which also rejects GraphQL, so they do not run gh pr or gh issue. The package-manager role also runs as a workflow (.github/workflows/package-manager.yml) with the app's identity; Dependabot keeps the Actions versions current and the package-manager approves its PRs. The overseer's digest reports what merged, and a revert is one PR."""
alternatives_rejected = []
rationale = """
The plan text gives no rationale beyond the decision itself, except that the app identity keeps the owner's reviews and comments distinguishable from agents', and the dismissal of stale approvals ensures a new commit is reviewed again before it can merge."""
consequences = """
The owner can approve tier-2 PRs from any device; cloud sessions do not run gh pr or gh issue; a revert is one PR."""
derived_from = []
links_note = """The plan text names no requirement this decision serves; it serves the process premise of open-items F, which has no R- record."""
