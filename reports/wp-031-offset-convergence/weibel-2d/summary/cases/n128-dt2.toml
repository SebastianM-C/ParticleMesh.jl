description = "Cold symmetric Weibel instability, beams at ±0.3 c along z, |k| = 2 ω_p/c along mode [2, 1], immobile ions; WP-031 scan point n128-dt2"
name = "weibel-2d-n128-dt2"
schema = 2

[derived]
amplitude_factor = 1.0
dt_divisor = "2//1"
fields = ["Bx", "By"]
from = "weibel-2d"
from_sha256 = "dca1230abbd9f8f61b1e550e0d799b3024c1e4a37abb2df7b8126c6b72bd7a76"
ppc_factor = "1//1"
refine = "1//2"
seed = "case"

[diagnostics]
fields = ["Bx", "By"]
fields_every = 16
scalars_every = 4

[grid]
boundaries = ["periodic", "periodic"]
cells = [128, 128]
length = [7.024814731040727, 7.024814731040727]

[numerics]
current_deposition = "esirkepov"
filter_passes = 0
precision = "Float64"
random_seed = 20261031
shape_order = 2

[observables.growth_rate_energy]
columns = ["Uelm_Bx_m", "Uelm_By_m"]
expectation = "the sum includes every in-plane mode; modes at larger |k| grow faster (γ → ω_p v₀/√γ₀ = 0.296 as |k| → ∞) from the loading noise, so the energy fit can sit above the theory value at |k| = 2 if they catch up before saturation"
formula = "as growth_rate_mode"
method = "exponential_window"
signal = "scalar_sum"
theory = 0.26372546821123183
window = [0.0001, 0.01]

[observables.growth_rate_mode]
component = "perpendicular"
fields = ["Bx", "By"]
formula = "X² − A X − B = 0, X = ω², A = k² + ω_p²/γ₀³, B = ω_p² v₀² k²/γ₀ for k ⊥ v₀ in the plane; γ = √(−X₋), X₋ = (A − √(A² + 4B))/2; derived in the header of scripts/crosscode/theory.jl (weibel_cold_growth_2d, T-273), unverified against the literature"
method = "exponential_window"
signal = "mode_projection"
theory = 0.26372546821123183
window = [0.0001, 0.01]

[[species]]
charge = -1.0
density = 0.5
drift = [0.0, 0.0, 0.3]
mass = 1.0
mobile = true
name = "beam_plus"
particles_per_cell = [8, 8]
position = "regular"
thermal_velocity = 0.0
velocity = "cold"

    [species.perturbation]
    amplitude = 0.001
    mode = [2, 1]
[[species]]
charge = -1.0
density = 0.5
drift = [0.0, 0.0, -0.3]
mass = 1.0
mobile = true
name = "beam_minus"
particles_per_cell = [8, 8]
position = "regular"
thermal_velocity = 0.0
velocity = "cold"

    [species.perturbation]
    amplitude = -0.001
    mode = [2, 1]
[[species]]
charge = 1.0
density = 1.0
drift = [0.0, 0.0, 0.0]
mass = 1836.0
mobile = false
name = "ion"
particles_per_cell = [1, 1]
position = "regular"
thermal_velocity = 0.0
velocity = "cold"

[time]
dt = 0.01843331807130136
t_end = 40.0

[wavevector]
angle = 0.4636476090008061
magnitude = 2.0
mode = [2, 1]
