# Tolerances of WP-014 (A7: measure, then propose). Every entry is a proposal: `C` is the
# constant the test asserts, `measured` the largest ratio err/(eps(T)·scale) seen on the CPU
# backend (Julia 1.13.3, one thread, the suite's configurations), with `scale` as stated. The
# owner accepts a value by editing A7; until then the tests hold these proposals. The suite
# prints the measured ratios after every run, so they can be refreshed.

