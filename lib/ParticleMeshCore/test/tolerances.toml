measured = { gamma = 0.35456900794051743 }
relative_error = { gamma = 0.0033 }
status = "proposed"

["T-143"]
quantity = "ForwardDiff dW/dα against a central finite-difference scan (fd_scan), Float64, Reference mode: rel[istar] / floor_rel"
