# WP-013, the engine on CUDA (RTX 4080 SUPER, CUDACore 6.5). Where a CUDA ratio exceeds a CPU
# bound, it gets its own entry here instead of a wider CPU bound. The device's arithmetic is not the host's: the
# compiler fuses multiply-adds on the device (suspected from the last-bit differences of
# T-172's scan against the host serial order; not verified at the PTX level), and `cos`, `log`
# and `sin` are CUDA's.

