# WP-021: the periodic spectral inverse of the discrete Laplacian and its forward-difference
# gradient (N = 2 on cells of 1/4 × 3/8, N = 1 on cells of 3/8). The solve is bitwise across
# thread counts (T-312), so one measurement holds for every thread count. Growth: measured on
# 16 × 12 to 256 × 192 and 64 to 4096 cells (reports/wp-021-periodic-solve-2d.md), the residual
# grows like the square root of Σ_d n_d, so the ratio to the linear scale below falls with the
# grid size and the smallest grid sets the measured value.

["T-310"]
quantity = "backward-difference divergence of the gradient of the solve minus (s - mean s), per interior node; |mean φ|"
scale = "(Σ_d n_d)·(max|s| + ‖L‖·max|φ|), ‖L‖ = Σ_d 4/Δ_d² the largest magnitude of the discrete Laplacian's symbol; (Σ_d n_d)·max|φ| for the mean (16 × 12, 64 × 48, 128 × 96; 64 and 2085 cells)"
C = 0.25
C_mean = 0.02
measured = { Float32 = 0.0406, Float64 = 0.0402, "Dual{Float32,3}" = 0.0389, mean_Float32 = 0.00267, mean_Float64 = 0.00169, "mean_Dual{Float32,3}" = 0.00213 }
status = "proposed"

["T-311"]
