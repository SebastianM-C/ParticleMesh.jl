# Physics against linear theory (A5): relative errors recorded, no threshold asserted.
["T-141"]
quantity = "Landau damping, kλ_D = 1/2: (measured - theory)/theory"
case = "64 cells, 16384 particles per cell, α = 1/20, v_th = c/20, dt = 0.05/ω_p, quadratic, Reference, fit over t ≤ 20/ω_p"
theory = { omega = 1.4156618886045367, gamma = -0.15335946690960467 }
measured = { omega = 1.4051852124682782, gamma = -0.1492419736219506 }
relative_error = { omega = -0.0074, gamma = -0.0268 }
status = "proposed, noise-limited: at 4096 particles per cell the fitted γ moves by ±10 % with the fit window"

["T-142"]
quantity = "cold two-stream growth rate, k v₀/ω_p = 3/5: (measured - theory)/theory"
