# WP-090's benchmark of ParticleMesh against PIConGPU 0.8.0 in 3D on one GPU (scripts/bench3d/bench3d.jl).
#
# Units of A1: lengths c/ω₀, times 1/ω₀, densities n_c, velocities c. The uniform plasma takes the
# LWFA case's cell along x (λ₀/32) in all three directions and its plateau density, warm enough that
# the Debye length is about one cell (v_th/√n = 0.19 = 0.95 Δx), so 400 steps heat it little.

schema = "bench3d-1"
name = "gpu-3d"
lambda0_um = 0.8

[uniform_defaults]
dx = 0.19634954084936207          # λ₀/32 = 2π/32, cubic cells
courant = 0.95                    # Δt = 0.95/√(3/Δx²) = 0.1077
density = 0.072
thermal_velocity = 0.05           # v_th per component (c); PIConGPU's T = mₑv_th² = 1.28 keV
float = "Float32"
steps = 400
warmup = 100                      # the steady time per step counts from the first timing point at or after this step
block = 20                        # ParticleMesh synchronizes every block steps; PIConGPU prints every 5 % (20 steps of 400)
modes = ["reference", "fast"]     # ParticleMesh's deposition modes: sort plus segmented reduction, and atomics

[[uniform]]
name = "c128-p1"
cells = [128, 128, 128]
ppc = [1, 1, 1]

[[uniform]]
name = "c128-p8"
cells = [128, 128, 128]
ppc = [2, 2, 2]

[[uniform]]
name = "c128-p27"
cells = [128, 128, 128]
ppc = [3, 3, 3]

[[uniform]]
name = "c256-p1"
cells = [256, 256, 256]
ppc = [1, 1, 1]

[[uniform]]
name = "c256-p8"
cells = [256, 256, 256]
ppc = [2, 2, 2]

[[uniform]]
name = "c128-p8-f64"
cells = [128, 128, 128]
ppc = [2, 2, 2]
float = "Float64"

[lwfa]
case = "scripts/lwfa/cases/ionization-3d.toml"   # WP-082's case, 448 × 128 × 128, 1704 steps
kinds = ["plasma-nodopant", "plasma"]
modes = ["reference", "fast"]
float = "Float32"
warmup = 170                      # PIConGPU prints every 85 steps (5 % of 1704)
block = 85
