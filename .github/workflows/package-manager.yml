name: Package manager

# Runs the package-manager role (brief: .claude/agents/package-manager.md) weekly for the dependency
# update and the Dependabot pull requests, or by hand. Any PR may add a dependency (F2), so there is no
# request inbox. It acts on GitHub as the factory app (token minted from the app's CI private key), so
# the PRs it opens trigger CI like any other; the Actions token would not.
# Secrets: CLAUDE_CODE_OAUTH_TOKEN, FACTORY_APP_ID, FACTORY_APP_PRIVATE_KEY.

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      task:
        description: "What to do (free text, for example: weekly update)"
        required: true
        type: string

permissions: {}

concurrency:
  group: package-manager
  cancel-in-progress: false

jobs:
  run:
    name: Package manager
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
      - name: git identity of the app
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
      - name: Write the task
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_TASK: ${{ inputs.task }}
        run: |
          {
            case "$EVENT" in
              schedule)
                echo "TASK: the weekly dependency update (brief, item 1), and the open Dependabot pull requests (brief, item 3)." ;;
              workflow_dispatch)
                echo "TASK (from the owner): $DISPATCH_TASK" ;;
            esac
          } > "$RUNNER_TEMP/task.md"
          cat "$RUNNER_TEMP/task.md"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          allowed_bots: "particlemesh-factory,particlemesh-factory[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            You are the package-manager role of this repository. Your brief is .claude/agents/package-manager.md
            in this checkout of the default branch; the task is in ${{ runner.temp }}/task.md. The contract
            is CLAUDE.md. Work on a pkg/ branch (`git switch -c pkg/<name>`), push it with
            `git push -u origin HEAD`, open the pull request with `gh pr create`, and enable auto-merge
            with `gh pr merge --auto --squash`. Problems that need the owner go into one `factory` issue
            (`gh issue create --label factory --body-file <file>`), after checking the open ones for a match.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Bash(julia:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git fetch:*),Bash(git switch:*),Bash(git checkout:*),Bash(git add:*),Bash(git restore:*),Bash(git commit:*),Bash(git push -u origin HEAD),Bash(git push origin HEAD),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr merge:*),Bash(gh pr review:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh issue comment:*),Read,Edit,Write,Grep,Glob"
