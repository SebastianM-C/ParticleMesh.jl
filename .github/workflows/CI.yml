name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.version == 'pre' }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.13', 'pre']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Update the manifest on the pre-release (it is resolved for 1.13)
        if: matrix.version == 'pre'
        run: julia --project -e 'using Pkg; Pkg.update()'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
  manifests:
    name: Committed manifests are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
      - name: Instantiate the workspace and scripts/ without changing the manifests
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: |
          julia --project -e 'using Pkg; Pkg.instantiate()'
          julia --project=scripts -e 'using Pkg; Pkg.instantiate()'
          git diff --exit-code -- Manifest.toml scripts/Manifest.toml
  trace:
    name: Trace records and test tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
      - name: Instantiate scripts/ without precompiling the plotting stack
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: julia --project=scripts -e 'using Pkg; Pkg.instantiate()'
      - name: Tests of the trace tooling
        run: julia --project=scripts scripts/trace/test/runtests.jl
      - name: Hashes, links and untraced tests (stale accepted records only warn)
        run: julia --project=scripts scripts/trace/build.jl --check
  dependency-guard:
    name: Dependency files change only on pkg/ branches
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare against the base branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE...HEAD" | grep -E '(^|/)(Project|Manifest[^/]*)\.toml$' || true)
          if [ -n "$changed" ] && [[ "$HEAD_REF" != pkg/* ]]; then
            echo "Only the package-manager role changes these files, on a pkg/ branch:" >&2
            echo "$changed" >&2
            exit 1
          fi
          echo "ok"
  leak-scan:
    name: Reject private infrastructure references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files
        run: |
          if git grep -nIE '(ssh://|BEGIN [A-Z ]*PRIVATE KEY|([0-9]{1,3}\.){3}[0-9]{1,3})' -- . ':!.github/workflows/CI.yml'; then
            echo "Found a pattern that looks like private infrastructure; see matches above." >&2
            exit 1
          fi
          echo "clean"
