name: CI
on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: a draft is not reviewed, so marking it ready runs the workflow again for its review.
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to a pull request replaces the run of the commit before it, its review included.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which parts of the repository a pull request touches, and the groups the Julia tests run in. The
  # other jobs skip their steps when a pull request touches no code, instead of skipping the job: a
  # skipped matrix job reports under its unexpanded name, which would leave a required check waiting
  # forever; the test groups are skipped as a job, and the required "Julia 1.13" job below reports for
  # them. Pushes to main always run everything.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      manifests: ${{ steps.diff.outputs.manifests }}
      suites: ${{ steps.groups.outputs.suites }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        name: Compare the pull request with its base
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "manifests=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request: run everything"
            exit 0
          fi
          # The pull_request checkout is the merge commit; its first parent is the base branch.
          # If the diff itself fails (a shallow checkout without the base, say), run everything rather than
          # skip the tests and leave the required checks to a job that never ran.
          if ! files=$(git diff --name-only HEAD^1 HEAD); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "manifests=true" >> "$GITHUB_OUTPUT"
            echo "git diff failed: run everything"
            exit 0
          fi
          echo "$files"
          code=false; manifests=false
          if grep -qE '^(src|lib|test|benchmark)/|^(Project|Manifest(-v[0-9.]+)?)\.toml$|^\.github/workflows/CI\.yml$' <<< "$files"; then
            code=true
          fi
          if grep -qE '(^|/)(Project|Manifest(-v[0-9.]+)?)\.toml$|^\.github/workflows/CI\.yml$' <<< "$files"; then
            manifests=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "manifests=$manifests" >> "$GITHUB_OUTPUT"
          echo "code: $code, manifests: $manifests"
      - id: groups
        name: The test groups, one job each
        # The root package's suite, then every lib/ package (ParticleMeshReactant has its own job) in
        # the groups of its test/groups.toml (lib/ParticleMeshCore/test/groups.jl), or whole when it
        # has none. Read from the tree, so a new package or group runs without a change here.
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import glob, json, os, tomllib
          suites = [{"name": "root", "project": ".", "group": ""}]
          for project in sorted(glob.glob("lib/*/Project.toml")):
              lib = os.path.dirname(project)
              name = os.path.basename(lib)
              if name == "ParticleMeshReactant":
                  continue
              short = name.removeprefix("ParticleMesh") or name
              spec = os.path.join(lib, "test", "groups.toml")
              if os.path.isfile(spec):
                  with open(spec, "rb") as f:
                      n = len(tomllib.load(f)["groups"])
                  suites += [{"name": f"{short} {i}/{n}", "project": lib, "group": str(i)} for i in range(1, n + 1)]
              else:
                  suites.append({"name": short, "project": lib, "group": ""})
          print("suites=" + json.dumps(suites))
          EOF
          grep '^suites=' "$GITHUB_OUTPUT"

  # The Julia tests, one job per suite group, in parallel, on 1.13 and on the pre-release. Each job
  # instantiates the workspace and runs one group in a fresh process (`PM_TEST_GROUP`).
  julia:
    name: Julia ${{ matrix.version }} (${{ matrix.suite.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.version == 'pre' }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.13', 'pre']
        suite: ${{ fromJSON(needs.changes.outputs.suites) }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
        with:
          # One cache per Julia version, shared by the groups, which instantiate the same workspace;
          # one per matrix entry would multiply the repository's cache storage by the group count.
          cache-name: julia-cache;workflow=${{ github.workflow }};job=julia;version=${{ matrix.version }}
          include-matrix: false
      - name: Update the manifest on the pre-release (it is resolved for 1.13)
        if: matrix.version == 'pre'
        run: julia --project -e 'using Pkg; Pkg.update()'
      - name: Instantiate the workspace
        run: julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: Test ${{ matrix.suite.project }}, group ${{ matrix.suite.group || 'all' }}
        env:
          PROJECT: ${{ matrix.suite.project }}
          PM_TEST_GROUP: ${{ matrix.suite.group }}
        run: julia --color=yes --project="$PROJECT" -e 'using Pkg; Pkg.test()'

  # The required check for the Julia tests: it passes when every 1.13 group passed, or when a pull
  # request touches no code and the groups were skipped. The pre-release groups continue on error
  # (A6), so they do not fail it.
  test:
    name: Julia 1.13
    needs: [changes, julia]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RESULT: ${{ needs.julia.result }}
        run: |
          if [ "$CHANGES" != success ]; then
            echo "the changed-paths job did not succeed ($CHANGES), so no tests ran" >&2
            exit 1
          elif [ "$CODE" != true ] && [ "$RESULT" = skipped ]; then
            echo "No code paths changed in this pull request; the Julia tests are skipped."
          elif [ "$RESULT" != success ]; then
            echo "a Julia 1.13 test group did not pass ($RESULT); see the Julia 1.13 (...) jobs" >&2
            exit 1
          else
            echo "every Julia 1.13 test group passed"
          fi
  reactant:
    # The Reactant CPU smoke test (architecture-draft.md §0.4 rule 7) lives in its own workspace member,
    # so the root julia-runtest job does not run it. Until the member exists this job passes trivially,
    # which lets it be a required check from the start.
    name: Reactant CPU smoke test
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7
      - id: member
        name: Does lib/ParticleMeshReactant exist yet, and does this change touch code
        env:
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          if [ "$CODE" != true ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No code paths changed in this pull request; the smoke test is skipped."
          elif [ -f lib/ParticleMeshReactant/Project.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'ParticleMeshReactant' Project.toml; then
            # A renamed or moved member must not turn this required check into a trivial pass.
            echo "the root workspace names ParticleMeshReactant, but lib/ParticleMeshReactant/Project.toml is missing" >&2
            exit 1
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "lib/ParticleMeshReactant does not exist yet; nothing to test"
          fi
      - if: steps.member.outputs.exists == 'true'
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - if: steps.member.outputs.exists == 'true'
        uses: julia-actions/cache@v3
      - if: steps.member.outputs.exists == 'true'
        name: Instantiate the workspace and run the smoke test
        run: |
          julia --project -e 'using Pkg; Pkg.instantiate()'
          julia --project=lib/ParticleMeshReactant -e 'using Pkg; Pkg.test()'
  manifests:
    name: Committed manifests are in sync
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.manifests != 'true'
        run: echo "No Project.toml or manifest changed in this pull request; the check is skipped."
      - if: needs.changes.outputs.manifests == 'true'
        uses: actions/checkout@v7
      - if: needs.changes.outputs.manifests == 'true'
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - if: needs.changes.outputs.manifests == 'true'
        uses: julia-actions/cache@v3
      - name: Instantiate the workspace and scripts/ without changing the manifests
        if: needs.changes.outputs.manifests == 'true'
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: |
          julia --project -e 'using Pkg; Pkg.instantiate()'
          julia --project=scripts -e 'using Pkg; Pkg.instantiate()'
          git diff --exit-code -- Manifest.toml scripts/Manifest.toml
  trace:
    name: Trace records and test tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
      - name: Instantiate scripts/ without precompiling the plotting stack
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: julia --project=scripts -e 'using Pkg; Pkg.instantiate()'
      - name: Tests of the trace checker
        run: julia --project=scripts scripts/trace/test/runtests.jl
      - name: Tests of the cross-code scripts
        run: julia --project=scripts scripts/crosscode/test/runtests.jl
      - name: Tests of the LWFA case's generators and readers
        run: julia --project=scripts scripts/lwfa/test/runtests.jl
      - name: Tests of the optimization scripts
        run: julia --project=scripts scripts/optim/test/runtests.jl
      - name: Goal links, test tags and engine dependencies
        run: julia --project=scripts scripts/trace/build.jl --check
  leak-scan:
    name: Reject private infrastructure references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files
        run: |
          # git grep exits 0 on a match, 1 on none, and above 1 on an error, which must not pass as clean.
          status=0
          git grep -nIE '(ssh:[/]/|BEGIN [A-Z ]*PRIVATE KEY|(^|[^0-9A-Za-z.])([0-9]{1,3}\.){3}[0-9]{1,3}([^0-9A-Za-z.]|\.([^0-9]|$)|$))' -- . || status=$?
          if [ "$status" -eq 0 ]; then
            echo "Found a pattern that looks like private infrastructure; see matches above." >&2
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "git grep failed with exit $status" >&2
            exit "$status"
          fi
          echo "clean"

  # The automated review, as the last jobs of this workflow: the code lens always, the numerics lens when
  # the diff touches src/, lib/, test/, benchmark/, scripts/, docs/goals/ or the architecture (briefs in
  # .claude/agents/*-reviewer.md, read from the base branch so a PR cannot edit an existing reviewer; a
  # brief new in the PR is taken from the PR, and .claude/ is a code-owner path). The review depends on
  # the tests through `needs`: the lenses start when every CI job above has succeeded, and the gate
  # fails without a review when one has not. The lens runs the PR's tests in the job that holds the
  # review token, so a same-repository PR could read it from test code; fork PRs are excluded, which
  # limits that to collaborators and the factory app. The gate job is a required check: it approves the
  # PR as github-actions[bot] when every lens passes, or requests changes and fails. On an approval,
  # minor findings go into one open `follow-up` issue per PR instead of a follow-up PR. A PR whose diff
  # touches a path in the base branch's CODEOWNERS is labelled `tier-2` and says so in the review.
  # Merge policy: F4 in docs/plan/factory-and-observability.md. Merging itself is GitHub's auto-merge,
  # enabled by the PR author (see CLAUDE.md, "Pull requests"). "Re-run failed jobs" on a run repeats
  # what failed and the jobs behind it, never the tests that passed: a failed CI job and then the
  # review, or a lens job that broke and then the gate. A gate that failed on a lens's blocking
  # finding is answered by a push; to review the same commit again, re-run its `Review (...)` job,
  # since re-running the gate alone repeats the stored verdict.
  # Secrets: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, a Max subscription token). If the action
  # ever rejects the plain GITHUB_TOKEN, install the Claude GitHub App on the repository, drop the
  # github_token input and grant `id-token: write` to the lens job instead.
  lenses:
    name: Choose the review lenses
    # The review depends on the tests: it starts when every CI job above has succeeded (the `Julia pre`
    # groups may fail, they continue on error), so a lens always has the test result of the commit it
    # reviews.
    needs: [test, reactant, manifests, trace, leak-scan]
    # Drafts are not reviewed. Dependabot PRs and PRs from forks see no repository secrets, so they
    # skip too; the package-manager role approves Dependabot, a human reviews fork PRs.
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]' && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      lenses: ${{ steps.pick.outputs.lenses }}
      tier2: ${{ steps.tier.outputs.files }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Numerics lens only when code, goals or the architecture change
        id: pick
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "$BASE"
          if git diff --name-only "origin/$BASE...HEAD" | grep -qE '^((src|lib|test|benchmark|scripts|docs/goals)/|docs/plan/architecture-draft\.md$)'; then
            echo 'lenses=["code","numerics"]' >> "$GITHUB_OUTPUT"
          else
            echo 'lenses=["code"]' >> "$GITHUB_OUTPUT"
          fi
      - name: Paths owned in the base branch's CODEOWNERS (tier 2)
        id: tier
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git show "origin/$BASE:.github/CODEOWNERS" > "$RUNNER_TEMP/CODEOWNERS"
          git diff --name-only "origin/$BASE...HEAD" > "$RUNNER_TEMP/changed.txt"
          python3 - "$RUNNER_TEMP/CODEOWNERS" "$RUNNER_TEMP/changed.txt" >> "$GITHUB_OUTPUT" <<'EOF'
          import json, re, sys
          def pattern(p):
              anchored = p.startswith("/") or "/" in p.rstrip("/")
              body, rx, i = p.strip("/"), "", 0
              while i < len(body):
                  if body.startswith("**/", i): rx, i = rx + "(.*/)?", i + 3
                  elif body.startswith("**", i): rx, i = rx + ".*", i + 2
                  elif body[i] == "*": rx, i = rx + "[^/]*", i + 1
                  elif body[i] == "?": rx, i = rx + "[^/]", i + 1
                  else: rx, i = rx + re.escape(body[i]), i + 1
              return re.compile(("^" if anchored else "(^|/)") + rx + ("/" if p.endswith("/") else "(/|$)"))
          rules = []
          for line in open(sys.argv[1]):
              parts = line.split("#", 1)[0].split()
              if parts:
                  rules.append((pattern(parts[0]), len(parts) > 1))
          owned = []
          for f in (l.strip() for l in open(sys.argv[2])):
              hits = [o for rx, o in rules if f and rx.search(f)]
              if hits and hits[-1]:
                  owned.append(f)
          print("files=" + json.dumps(owned))
          EOF

  lens:
    name: Review (${{ matrix.lens }})
    needs: lenses
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        lens: ${{ fromJSON(needs.lenses.outputs.lenses) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Reviewer brief and contract from the base branch
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          LENS: ${{ matrix.lens }}
        run: |
          git fetch --no-tags origin "$BASE"
          git show "origin/$BASE:CLAUDE.md" > "$RUNNER_TEMP/contract.md"
          if ! git show "origin/$BASE:.claude/agents/$LENS-reviewer.md" > "$RUNNER_TEMP/brief.md" 2>/dev/null; then
            # A brief that does not exist on the base branch yet is being introduced by this PR; it needs
            # the owner's approval anyway (.claude/ is a CODEOWNERS path), so use the PR's copy.
            echo "::warning::no $LENS-reviewer brief on $BASE yet; using this PR's copy"
            cp ".claude/agents/$LENS-reviewer.md" "$RUNNER_TEMP/brief.md"
          fi
      - name: The CI jobs of this run
        # They have all finished and succeeded, or this job would not run (`needs` of the lenses job); the
        # list tells the lens which ran and how the `Julia pre` groups, which may fail, ended.
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "# CI on ${HEAD:0:7}"
            gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
              -q '[.jobs[] | select(.status == "completed") | "- \(.name): \(.conclusion)"] | join("\n")'
            echo "Every job this review depends on has passed. The \`Julia pre (...)\` jobs are allowed to fail (CLAUDE.md, A6)."
          } > "$RUNNER_TEMP/ci.md"
          cat "$RUNNER_TEMP/ci.md"
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
      - name: Review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # PRs opened by the factory app are initiated by a bot actor; the action refuses those unless listed.
          allowed_bots: "particlemesh-factory,particlemesh-factory[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            You are the ${{ matrix.lens }} reviewer of this repository. Your brief is the file
            ${{ runner.temp }}/brief.md and the contract every change must respect is
            ${{ runner.temp }}/contract.md; both come from the base branch (only a brief that is new in
            this PR comes from the PR itself). The CI jobs of this commit finished before this review
            started and are listed in ${{ runner.temp }}/ci.md: every one of them passed (the
            `Julia pre (...)` jobs may have failed, which is allowed). The Julia jobs run the tests of the
            root package and of every lib/ package, split into the groups of each package's
            test/groups.toml, and only when the diff touches src/, lib/, test/, benchmark/, a root
            Project or Manifest file or this workflow; the trace job runs the tests of scripts/trace,
            scripts/crosscode, scripts/lwfa and scripts/optim. For those tests, that is the result your
            brief asks for. CI runs no other tests: when the change touches tests outside that list (another
            directory of scripts/, say), run them yourself.
            The PR head is checked
            out in the working directory. Read the brief and the contract, then `gh pr view` and
            `gh pr diff` for the change and its description, read the files it touches, and run what the
            brief asks for (Julia 1.13 is installed; the CPU tests are
            `julia --project -e 'using Pkg; Pkg.test()'`, or `--project=lib/<Name>` for a subpackage).
            Do not post comments, do not edit files, do not push. Return only the structured verdict:
            "pass" when nothing blocks the merge, "fail" when at least one finding is blocking. Each
            finding has a severity ("blocking" or "minor"), a file, a line (0 when none applies) and one
            sentence saying what is wrong and how to verify it. The summary is two sentences.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(julia:*),Read,Grep,Glob"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["pass","fail"]},"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"object","properties":{"severity":{"type":"string","enum":["blocking","minor"]},"file":{"type":"string"},"line":{"type":"integer"},"note":{"type":"string"}},"required":["severity","file","line","note"]}}},"required":["verdict","summary","findings"]}'
      - name: Save the verdict
        env:
          VERDICT: ${{ steps.review.outputs.structured_output }}
          LENS: ${{ matrix.lens }}
        run: |
          mkdir -p "$RUNNER_TEMP/verdict"
          # Fail closed: no output, or no verdict, is not a pass.
          if ! printf '%s\n' "$VERDICT" | jq -e '.verdict == "pass" or .verdict == "fail"' >/dev/null 2>&1; then
            echo "the $LENS lens returned no verdict" >&2
            exit 1
          fi
          printf '%s\n' "$VERDICT" | jq --arg lens "$LENS" '. + {lens: $lens}' > "$RUNNER_TEMP/verdict/$LENS.json"
          jq -r '"\(.lens): \(.verdict), \(.findings | length) finding(s)"' "$RUNNER_TEMP/verdict/$LENS.json"
      - uses: actions/upload-artifact@v7
        with:
          name: verdict-${{ matrix.lens }}
          path: ${{ runner.temp }}/verdict/${{ matrix.lens }}.json

  gate:
    name: Review gate
    needs: [test, reactant, manifests, trace, leak-scan, lenses, lens]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: No review without passing tests
        # A failed or cancelled CI job skips the lenses, which must not read as a draft's skipped review.
        if: ${{ needs.test.result != 'success' || needs.reactant.result != 'success' || needs.manifests.result != 'success' || needs.trace.result != 'success' || needs.leak-scan.result != 'success' }}
        run: |
          echo "a CI job did not pass, so no review ran; fix the failing job and push, or re-run the failed jobs" >&2
          exit 1
      - name: Skipped review passes the gate without an approval
        if: ${{ needs.lenses.result == 'skipped' }}
        run: echo "draft, Dependabot or fork pull request; no automated approval"
      - name: An incomplete review blocks
        # Covers a failed lens selection too: then the lens jobs are skipped, which must not pass the gate.
        if: ${{ needs.lenses.result == 'failure' || needs.lenses.result == 'cancelled' || needs.lens.result == 'failure' || needs.lens.result == 'cancelled' || (needs.lenses.result == 'success' && needs.lens.result == 'skipped') }}
        run: |
          echo "a review job did not complete; see the Review (...) jobs" >&2
          exit 1
      - uses: actions/download-artifact@v8
        if: ${{ needs.lens.result == 'success' }}
        with:
          pattern: verdict-*
          merge-multiple: true
          path: verdicts
      - name: Approve or request changes
        if: ${{ needs.lens.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LENSES: ${{ needs.lenses.outputs.lenses }}
          TIER2: ${{ needs.lenses.outputs.tier2 }}
        run: |
          set -euo pipefail
          expected=$(printf '%s' "$LENSES" | jq 'length')
          tier2=$(printf '%s' "${TIER2:-[]}" | jq -r 'if length > 0 then "**Tier 2:** this PR changes code-owner paths (" + (map("`" + . + "`") | join(", ")) + "). The digest lists it for the owner.\n\n" else "" end')
          body=$(jq -rs '
            def line: "- **\(.severity)** `\(.file)`\(if .line > 0 then ":\(.line)" else "" end): \(.note)";
            "Automated review of \(env.HEAD[0:7]) by the \(map(.lens) | join(" and ")) lens(es), written by Claude Code (claude-opus-5-5) in `.github/workflows/CI.yml`.\n\n"
            + (map("### \(.lens): \(.verdict)\n\n\(.summary)\n"
                   + (if (.findings | length) > 0 then "\n" + (.findings | map(line) | join("\n")) + "\n" else "" end))
               | join("\n"))
          ' verdicts/*.json)
          body="$tier2$body"
          count=$(jq -rs 'length' verdicts/*.json)
          passes=$(jq -rs 'map(select(.verdict == "pass")) | length' verdicts/*.json)
          if [ "$count" != "$expected" ]; then
            echo "expected $expected verdict(s), found $count" >&2
            exit 1
          fi
          # If the repository setting "Allow GitHub Actions to create and approve pull requests" is off,
          # the approve call errors and this job turns red rather than stalling silently.
          if [ "$passes" = "$expected" ]; then
            gh pr review "$PR" --approve --body "$body"
          else
            gh pr review "$PR" --request-changes --body "$body"
            echo "$((count - passes)) lens(es) requested changes" >&2
            exit 1
          fi
      - name: File minor findings as a follow-up issue
        # Only after an approval; a failure here (a missing label, say) never blocks the merge. Never for a
        # janitor PR (branch janitor/<issue>): the janitor works the follow-up issues, and filing new ones
        # from its own PRs would feed it its own output; those findings stay in the review comment.
        if: ${{ needs.lens.result == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          case "$BRANCH" in
            janitor/*) echo "janitor PR; minor findings stay in the review, no follow-up issue"; exit 0 ;;
          esac
          if [ "$(jq -rs 'all(.verdict == "pass")' verdicts/*.json)" != true ]; then
            echo "not approved; nothing to file"
            exit 0
          fi
          minors=$(jq -rs '[.[] | .findings[] | select(.severity == "minor")] | length' verdicts/*.json)
          if [ "$minors" = 0 ]; then
            echo "no minor findings"
            exit 0
          fi
          body=$(jq -rs '
            def line: "- [ ] `\(.file)`\(if .line > 0 then ":\(.line)" else "" end) (\(.lens)): \(.note)";
            "Minor findings from the automated review of #\(env.PR) at \(env.HEAD[0:7]). They did not block the merge; "
            + "the janitor, which runs after every review, fixes the small ones, the next pull request in this area picks up the rest, and the PR that takes the last item closes this issue with `Fixes #<n>`.\n\n"
            + ([.[] | .lens as $l | .findings[] | select(.severity == "minor") | . + {lens: $l}] | map(line) | join("\n"))
            + "\n\n---\n_Generated by [Claude Code](https://claude.ai/code) in `.github/workflows/CI.yml`_"
          ' verdicts/*.json)
          title="Review follow-ups for #$PR"
          existing=$(gh issue list --label follow-up --state open --search "in:title $title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label follow-up --body "$body"
          fi
      - name: Label tier-2 pull requests
        # Never blocks the merge; the label is how the digest finds tier-2 changes. It also runs after an
        # incomplete review or a "request changes" verdict, each of which fails an earlier step.
        if: ${{ !cancelled() && needs.lenses.result == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TIER2: ${{ needs.lenses.outputs.tier2 }}
        run: |
          if [ "$(printf '%s' "${TIER2:-[]}" | jq 'length')" != 0 ]; then
            gh pr edit "$PR" --add-label tier-2
          else
            gh pr edit "$PR" --remove-label tier-2 || true
          fi
